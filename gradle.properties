android.useAndroidX=true
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
android.nonTransitiveRClass=true

# Preserve the existing package identity; never substitute a per-agent/shared key.
codexSigningManagedByProject=true

# Media3 1.11.1 (motor de Nexus Cut) exige compilar contra Android 36; AGP 8.7.3 lo admite con este aviso silenciado. targetSdk sigue en 35.
android.suppressUnsupportedCompileSdk=36
