# Close Chromium through CDP before systemd signals the unit, so rotated Google
# cookies are flushed to disk instead of being lost to an abrupt kill.
[Service]
ExecStop=%h/.local/share/nexus-flow-probe/venv/bin/python %h/.local/share/nexus-flow-probe/flow_keepalive.py --close-browser
TimeoutStopSec=45
