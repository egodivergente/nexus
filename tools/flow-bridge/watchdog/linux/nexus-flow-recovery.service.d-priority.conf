# Copiar como ~/.config/systemd/user/nexus-flow-recovery.service.d/priority.conf
# Solo prioridad y reinicio; no cambia ExecStart, ni el perfil, ni el token.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=6

[Service]
Restart=always
RestartSec=5
Nice=0
CPUWeight=1000
IOWeight=1000
OOMScoreAdjust=-100
