name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 35
        # Usa el Android SDK que ya trae el runner de GitHub
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleAgentPreview 2>&1 | tee -a gradle.log

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-agent-preview-apk
          path: app/build/outputs/apk/agentPreview/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process test :app:assembleOfflineQa :app:assembleOfflineQaAndroidTest 2>&1 | tee -a gradle.log

      - name: Enable KVM for isolated UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run presentation UI tests (offline fixtures)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          # API35 defaults to a 6G userdata partition; runner had 3.8G left after build.
          # Offline fixtures need only the app, test APK and small local assets.
          disk-size: 2048M
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/offlineQa/app-offlineQa.apk
            adb install -r app/build/outputs/apk/androidTest/offlineQa/app-offlineQa-androidTest.apk
            adb shell am instrument -w -r -e class com.vidadomu.nexus.assistant.AssistantPresentationUiTest,com.vidadomu.nexus.ChatRichContentDeviceTest com.vidadomu.nexus.qa.test/androidx.test.runner.AndroidJUnitRunner | tee ui-evidence-instrumentation.log
            grep -Eq '^OK \([0-9]+ tests?\)' ui-evidence-instrumentation.log
            mkdir -p ui-evidence
            # Collect before Gradle/UTP uninstalls the QA sandbox and its external files.
            adb pull /sdcard/Android/data/com.vidadomu.nexus.qa/files/studio-ux ui-evidence/
            adb pull /sdcard/Android/data/com.vidadomu.nexus.qa/files/rich-qa ui-evidence/

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-test-evidence
          path: |
            agent-core/build/test-results/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ui-evidence/
            ui-evidence-instrumentation.log
            gradle.log
          if-no-files-found: warn

      - name: Show Gradle errors
        if: failure()
        run: |
          test -f gradle.log || exit 0
          msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILED|^> |Exception" gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"
