name: Nexus CI

# Tres trabajos: Android (compila y pruebas JVM) y Windows (núcleo del agente JVM y sintaxis de Python y
# JavaScript) bloquean; las pruebas de interfaz en emulador van aparte, y la de contenido rico, que es
# intermitente, no tumba la ejecución. Un push nuevo a la misma rama cancela el anterior; los cambios
# que solo tocan documentos no lanzan nada.

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android, compilación y pruebas JVM
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 35
        # Usa el Android SDK que ya trae el runner de GitHub
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleAgentPreview 2>&1 | tee -a gradle.log

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-agent-preview-apk
          path: app/build/outputs/apk/agentPreview/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process test :app:assembleOfflineQa :app:assembleOfflineQaAndroidTest 2>&1 | tee -a gradle.log

      - name: Hand the QA APKs to the UI tests
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-offline-qa-apks
          path: |
            app/build/outputs/apk/offlineQa/app-offlineQa.apk
            app/build/outputs/apk/androidTest/offlineQa/app-offlineQa-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-unit-test-results
          path: |
            agent-core/build/test-results/
            cut-core/build/test-results/
            axel-link/build/test-results/
            app/build/test-results/
            gradle.log
          if-no-files-found: warn

      - name: Show Gradle errors
        if: failure()
        run: |
          test -f gradle.log || exit 0
          msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILED|^> |Exception" gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"

  ui-tests:
    name: Android, pruebas de interfaz en emulador
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Get the QA APKs
        uses: actions/download-artifact@v4
        with:
          name: NEXUS-offline-qa-apks
          path: qa

      - name: Enable KVM for isolated UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run presentation UI tests (offline fixtures)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          # Offline fixtures need only the app, test APK and small local assets.
          disk-size: 2048M
          disable-animations: true
          script: |
            set -eu
            adb install -r qa/offlineQa/app-offlineQa.apk
            adb install -r qa/androidTest/offlineQa/app-offlineQa-androidTest.apk
            adb shell am instrument -w -r -e class com.vidadomu.nexus.assistant.AssistantPresentationUiTest com.vidadomu.nexus.qa.test/androidx.test.runner.AndroidJUnitRunner | tee ui-evidence-instrumentation.log
            grep -Eq '^OK \([0-9]+ tests?\)' ui-evidence-instrumentation.log
            # Intermitente (lápiz y contenido rico): se ejecuta y se guarda, pero su fallo no bloquea.
            adb shell am instrument -w -r -e class com.vidadomu.nexus.ChatRichContentDeviceTest com.vidadomu.nexus.qa.test/androidx.test.runner.AndroidJUnitRunner | tee ui-rich-instrumentation.log || true
            if ! grep -Eq '^OK \([0-9]+ tests?\)' ui-rich-instrumentation.log; then echo "::warning title=ChatRichContentDeviceTest::falló (intermitente, no bloquea)"; fi
            mkdir -p ui-evidence
            # Collect before the QA sandbox and its external files go away.
            adb pull /sdcard/Android/data/com.vidadomu.nexus.qa/files/studio-ux ui-evidence/ || true
            adb pull /sdcard/Android/data/com.vidadomu.nexus.qa/files/rich-qa ui-evidence/ || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-test-evidence
          path: |
            ui-evidence/
            ui-evidence-instrumentation.log
            ui-rich-instrumentation.log
          if-no-files-found: warn

  desktop:
    name: Windows, núcleo del agente y sintaxis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python compiles
        run: python -m compileall -q desktop

      - name: JavaScript parses
        run: |
          set -e
          for f in $(git ls-files 'desktop/ui/*.js'); do node --check "$f"; done

      - name: Desktop agent tests and runtime
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel -p desktop/agent test :core:test runtime 2>&1 | tee -a desktop-gradle.log

      - name: Upload desktop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-desktop-results
          path: |
            desktop/agent/build/test-results/
            desktop/agent/core/build/test-results/
            desktop-gradle.log
          if-no-files-found: warn
