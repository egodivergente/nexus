name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform 35
        # Usa el Android SDK que ya trae el runner de GitHub
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug and AgentPreview APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:assembleAgentPreview 2>&1 | tee -a gradle.log

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AgentPreview APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AgentPreview-for-local-signing
          path: app/build/outputs/apk/agentPreview/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon test 2>&1 | tee -a gradle.log

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-unit-test-reports
          path: |
            app/build/test-results/**/TEST-*.xml
            agent-core/build/test-results/**/TEST-*.xml
          if-no-files-found: warn

      - name: Show Gradle errors
        if: failure()
        run: |
          test -f gradle.log || exit 0
          msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILED|^> |Exception" gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"
